[package]
name = "cargo-nuttx"
version = "0.0.1"
edition = "2024"
rust-version = "1.95"
description = "A cargo subcommand for building NuttX-based embedded projects into firmware images"
repository = "https://github.com/kay-lambdadelta/cargo-nuttx"
license = "MIT OR Apache-2.0"

[dependencies]
camino = { version = "1.2", features = ["serde1"] }
cargo_metadata = "0.23"
clap = { version = "4.6", features = ["derive"] }
convert_case = "0.11"
dirs = "6.0"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
ureq = "3.4"
